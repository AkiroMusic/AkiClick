[package]
name = "akiclick"
version = "1.3.0"
description = "AkiClick - Lightweight Windows Auto Clicker"
authors = ["Akiro"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_ini = "0.1"
anyhow = "1.0"
enigo = { version = "0.1", features = [] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
