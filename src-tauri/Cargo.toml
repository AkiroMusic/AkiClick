[package]
name = "akiclick"
version = "1.0.0"
description = "AkiClick - Lightweight Windows Auto Clicker"
authors = ["Akiro"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "process-relaunch-dangerous-allow-symlink-macos"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_ini = "0.1"
directories = "5.0"
anyhow = "1.0"
enigo = { version = "0.1", features = [] }
once_cell = "1.19"
parking_lot = "0.12"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
